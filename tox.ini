[tox]
envlist = py{311,312,313,314}, report, docs



[tool:pytest]
addopts =
    --cov-report=term-missing



[testenv]
setenv = py{311,312,313,314}: COVERAGE_FILE = .coverage.{envname}
commands = pytest --cov --cov-config={toxinidir}/.coveragerc {posargs:-vv}
deps = pytest-cov

depends = report: py{311,312,313,314}

changedir = tests



[testenv:report]
skip_install = true
deps = coverage
commands =
    coverage combine
    coverage json
    coverage report --fail-under=100



[testenv:docs]
deps =
extras = docs
changedir = docs

commands = sphinx-build -M html . _build