# This file defines the jobs that should be ran during the GitLab repository's
# CI/CD pipeline.
stages:
  - test
  - deploy



# This job runs unit tests for Python version 3.14.
test:
  stage: test
  image: python:3.14
  variables:
    PY_COLORS: "1"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pip install --upgrade pip
    - pip install tox
    - python -m tox -e py314
  tags:
    - <INSERT_TEST_TAGS>



# This job builds and deploys the documentation website.
pages:
  stage: deploy
  image: python:3.14
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_DEPTH: "0"
  script:
    - echo "Building documentation..."
    - python -m pip install --upgrade pip
    - python -m pip install .[docs]
    - cd docs
    - >
      python build_docs.py
      --root_url="${CI_PAGES_URL}"
      --doc_dir_basename=public
    - cd ../
  tags:
    - <INSERT_DOC_TAGS>
  artifacts:
    paths:
      - public